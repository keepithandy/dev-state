name: Package smoke

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify distribution contents
        shell: python
        run: |
          import glob
          import tarfile
          import zipfile

          wheels = glob.glob("dist/*.whl")
          sdists = glob.glob("dist/*.tar.gz")
          assert len(wheels) == 1, wheels
          assert len(sdists) == 1, sdists

          with zipfile.ZipFile(wheels[0]) as archive:
              names = archive.namelist()
              assert any(name.endswith("dev_kit/cli.py") for name in names), names
              assert any(name.endswith("METADATA") for name in names), names

          with tarfile.open(sdists[0], "r:gz") as archive:
              names = archive.getnames()
              assert any(name.endswith("src/dev_kit/cli.py") for name in names), names
              assert any(name.endswith("pyproject.toml") for name in names), names
      - name: Create clean install environment
        run: python -m venv .venv-package-smoke
      - name: Install built wheel
        run: .venv-package-smoke/bin/python -m pip install dist/*.whl
      - name: Verify installed metadata
        run: .venv-package-smoke/bin/python -c "import importlib.metadata as m; assert m.version('dev-kit') == '0.1.0'"
      - name: Check installed CLI help
        run: .venv-package-smoke/bin/dev-kit --help
      - name: Run fixture audit from installed package
        run: .venv-package-smoke/bin/dev-kit audit --path tests/fixtures/clean_project
